    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        /* Layout */
        --sidebar-w: 0px;
        --shell-max: 100%;
        --content-max: 480px;
        --page-pad: 16px;
        --fs-scale: clamp(0.82, 2.8vw, 1);
      }
      @media (min-width: 540px) {
        :root { --content-max: 540px; --fs-scale: 1; }
      }
      @media (min-width: 768px) {
        :root { --content-max: 720px; --page-pad: 24px; }
      }
      @media (min-width: 1024px) {
        :root {
          --sidebar-w: 220px;
          --content-max: 860px;
          --page-pad: 32px;
        }
      }
      @media (min-width: 1280px) {
        :root { --content-max: 1000px; }
      }
      @media (min-width: 1440px) {
        :root { --content-max: 1100px; }
      }
      html { font-size: calc(16px * var(--fs-scale)); }
      body { font-family: 'Inter', sans-serif; background: #0F1115; color: #E2E2E6; min-height: 100vh;
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
      #root { min-height: 100vh; }

      /* Sidebar offset untuk konten utama */
      .with-sidebar { margin-left: var(--sidebar-w); transition: margin-left 0.2s; }

      /* Hover utility */
      .btn-hover { transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s; }
      .btn-hover:hover { opacity: 0.88; transform: translateY(-1px); }

      /* Card hover */
      .card-hover { transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; }
      .card-hover:hover { border-color: rgba(99,102,241,0.4) !important; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transform: translateY(-2px); }

      /* Content centering helper */
      @media (min-width: 768px) {
        .tomat-content { max-width: var(--content-max); margin-left: auto; margin-right: auto; }
      }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #1E2128; }
      ::-webkit-scrollbar-thumb { background: #6366F1; border-radius: 3px; }
      input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #2d3748; outline: none; }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
      input[type=number] { background: #1E2128; border: 1px solid #374151; color: #E2E2E6; border-radius: 8px; padding: 10px 14px; font-size: 16px; width: 100%; outline: none; font-family: inherit; }
      input[type=number]:focus { border-color: #6366F1; }
      input[type=text] { background: #1E2128; border: 1px solid #374151; color: #E2E2E6; border-radius: 8px; padding: 10px 14px; font-size: 16px; width: 100%; outline: none; font-family: inherit; }
      input[type=text]:focus { border-color: #6366F1; }
    </style>
  </head>
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #0F1115;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.25s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash-logo { display: flex; align-items: center; justify-content: center; }
    #splash-logo-old {
      width: 88px; height: 88px; border-radius: 22px;
      background: #1E2128; display: flex; align-items: center; justify-content: center;
      font-size: 52px;
    }
    #splash-title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 900; color: #E2E2E6; letter-spacing: -0.5px; }
    #splash-sub { font-family: 'Inter', sans-serif; font-size: 13px; color: #64748B; }
    #splash-dots { display: flex; gap: 8px; margin-top: 8px; }
    #splash-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: #6366F1;
      animation: bounce 1s ease-in-out infinite;
    }
    #splash-dots span:nth-child(2) { animation-delay: 0.15s; background: #A78BFA; }
    #splash-dots span:nth-child(3) { animation-delay: 0.30s; background: #C4B5FD; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
  <body>
    <div id="splash">
      <div id="splash-logo"><img src="/logo-smartisa.png" alt="SMARTISA" style="width:72px;height:72px;object-fit:contain;border-radius:16px;" /></div>
      <div id="splash-title">SMARTISA</div>
      <div id="splash-sub">Platform Pembelajaran TISA</div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash once React has painted its first frame
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 300); }
      };

      // Fullscreen API — sembunyikan Android nav bar tanpa perlu install PWA.
      // Hanya aktif di mobile (< 768px); desktop tidak perlu fullscreen.
      // Browser mengharuskan gesture user (tap/click) sebelum requestFullscreen bisa dipanggil.
      (function() {
        var isDesktop = window.innerWidth >= 768;
        if (isDesktop) return; // desktop: tidak perlu fullscreen

        var el = document.documentElement;
        var isStandalone = window.matchMedia('(display-mode: fullscreen)').matches
                        || window.matchMedia('(display-mode: standalone)').matches
                        || window.navigator.standalone;

        function goFullscreen() {
          if (isStandalone) return; // sudah fullscreen via PWA install, tidak perlu
          if (document.fullscreenElement) return;
          var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
          if (req) req.call(el).catch(function(){});
        }

        // Re-enter fullscreen jika user keluar (e.g. notifikasi, alt-tab)
        document.addEventListener('fullscreenchange', function() {
          if (!document.fullscreenElement && !isStandalone) {
            // Jangan langsung re-request tanpa gesture — tunggu tap berikutnya
            document.addEventListener('click', goFullscreen, { once: true });
            document.addEventListener('touchstart', goFullscreen, { once: true });
          }
        });

        // Request saat tap pertama
        document.addEventListener('click', goFullscreen, { once: true });
        document.addEventListener('touchstart', goFullscreen, { once: true });
      })();
    </script>
  </body>
</html>
