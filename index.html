<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOMAT – Tantangan Otak Matematika</title>
    <meta name="description" content="TOMAT - Platform gamifikasi matematika SMP dengan duel real-time, turnamen, dan sistem reward." />
    <meta name="theme-color" content="#0F1115" />
    <meta property="og:title" content="TOMAT — Tantangan Otak Matematika" />
    <meta property="og:description" content="Belajar matematika SMP dengan cara yang menyenangkan. Duel teman, ikut turnamen, kumpulkan reward!" />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOMAT" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload bingkai images so they're ready before the shop opens -->
    <link rel="preload" as="image" href="/bingkai-neon.png" />
    <link rel="preload" as="image" href="/bingkai-api.png" />
    <link rel="preload" as="image" href="/bingkai-es.png" />
    <link rel="preload" as="image" href="/bingkai-sakura.png" />
    <link rel="preload" as="image" href="/petal-rose.png" />
    <link rel="preload" as="image" href="/garuda.gif" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        /* Layout */
        --sidebar-w: 0px;
        --shell-max: 100%;
        --content-max: 480px;
        --page-pad: 16px;
        --fs-scale: clamp(0.82, 2.8vw, 1);
      }
      @media (min-width: 540px) {
        :root { --content-max: 540px; --fs-scale: 1; }
      }
      @media (min-width: 768px) {
        :root { --content-max: 720px; --page-pad: 24px; }
      }
      @media (min-width: 1024px) {
        :root {
          --sidebar-w: 220px;
          --content-max: 860px;
          --page-pad: 32px;
        }
      }
      @media (min-width: 1280px) {
        :root { --content-max: 1000px; }
      }
      @media (min-width: 1440px) {
        :root { --content-max: 1100px; }
      }
      html { font-size: calc(16px * var(--fs-scale)); }
      body { font-family: 'Inter', sans-serif; background: #0F1115; color: #E2E2E6; min-height: 100vh; }
      #root { min-height: 100vh; }

      /* Sidebar offset untuk konten utama */
      .with-sidebar { margin-left: var(--sidebar-w); transition: margin-left 0.2s; }

      /* Hover utility */
      .btn-hover { transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s; }
      .btn-hover:hover { opacity: 0.88; transform: translateY(-1px); }

      /* Card hover */
      .card-hover { transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; }
      .card-hover:hover { border-color: rgba(99,102,241,0.4) !important; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transform: translateY(-2px); }

      /* Content centering helper */
      @media (min-width: 768px) {
        .tomat-content { max-width: var(--content-max); margin-left: auto; margin-right: auto; }
      }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #1E2128; }
      ::-webkit-scrollbar-thumb { background: #6366F1; border-radius: 3px; }
      input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #2d3748; outline: none; }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
      input[type=number] { background: #1E2128; border: 1px solid #374151; color: #E2E2E6; border-radius: 8px; padding: 10px 14px; font-size: 16px; width: 100%; outline: none; font-family: inherit; }
      input[type=number]:focus { border-color: #6366F1; }
      input[type=text] { background: #1E2128; border: 1px solid #374151; color: #E2E2E6; border-radius: 8px; padding: 10px 14px; font-size: 16px; width: 100%; outline: none; font-family: inherit; }
      input[type=text]:focus { border-color: #6366F1; }
    </style>
  </head>
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #0F1115;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.25s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash-logo {
      width: 88px; height: 88px; border-radius: 22px;
      background: #1E2128; display: flex; align-items: center; justify-content: center;
      font-size: 52px;
    }
    #splash-title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 900; color: #E2E2E6; letter-spacing: -0.5px; }
    #splash-sub { font-family: 'Inter', sans-serif; font-size: 13px; color: #64748B; }
    #splash-dots { display: flex; gap: 8px; margin-top: 8px; }
    #splash-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: #6366F1;
      animation: bounce 1s ease-in-out infinite;
    }
    #splash-dots span:nth-child(2) { animation-delay: 0.15s; background: #A78BFA; }
    #splash-dots span:nth-child(3) { animation-delay: 0.30s; background: #C4B5FD; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
  <body>
    <div id="splash">
      <div id="splash-logo">🍅</div>
      <div id="splash-title">TOMAT</div>
      <div id="splash-sub">Tantangan Otak Matematika</div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash once React has painted its first frame
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 300); }
      };
    </script>
  </body>
</html>
