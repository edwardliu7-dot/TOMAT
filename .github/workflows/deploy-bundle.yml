name: Deploy OTA Bundle

# Trigger: setiap push ke branch main
on:
  push:
    branches:
      - main
    # Hanya jalan jika ada perubahan di src/ atau server/ (skip jika hanya update docs)
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'

  # Bisa juga trigger manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Override version (kosongkan = pakai versi dari src/version.js)'
        required: false
        default: ''

jobs:
  deploy-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout kode ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Vite ───────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── 5. Ambil versi dari src/version.js ──────────────────────────────────
      - name: Get bundle version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            VERSION="${{ github.event.inputs.force_version }}"
          else
            VERSION=$(node -e "import('./src/version.js').then(m => process.stdout.write(m.APP_VERSION))")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bundle version: $VERSION"

      # ── 6. Buat zip bundle ──────────────────────────────────────────────────
      - name: Create bundle zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p bundles
          cd dist && zip -r "../bundles/tomat-${VERSION}.zip" . --quiet && cd ..
          CHECKSUM=$(sha256sum "bundles/tomat-${VERSION}.zip" | awk '{print $1}')
          SIZE=$(stat -c%s "bundles/tomat-${VERSION}.zip")
          echo "BUNDLE_FILE=bundles/tomat-${VERSION}.zip" >> $GITHUB_ENV
          echo "BUNDLE_NAME=tomat-${VERSION}.zip" >> $GITHUB_ENV
          echo "BUNDLE_CHECKSUM=sha256:${CHECKSUM}" >> $GITHUB_ENV
          echo "BUNDLE_SIZE=${SIZE}" >> $GITHUB_ENV
          echo "Bundle: tomat-${VERSION}.zip | ${SIZE} bytes | sha256:${CHECKSUM}"

      # ── 7. Setup SSH ────────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 8. Upload bundle zip ke VPS ─────────────────────────────────────────
      - name: Upload bundle to VPS
        run: |
          scp -i ~/.ssh/id_rsa \
            "${{ env.BUNDLE_FILE }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/bundles/${{ env.BUNDLE_NAME }}"

      # ── 9. Update app-version.js di VPS & restart server ───────────────────
      - name: Apply update on VPS
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_URL="${{ secrets.VPS_BUNDLE_BASE_URL }}/bundles/${{ env.BUNDLE_NAME }}"
          SIZE="${{ env.BUNDLE_SIZE }}"
          CHECKSUM="${{ env.BUNDLE_CHECKSUM }}"

          ssh -i ~/.ssh/id_rsa \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            bash -s << EOF
            set -e
            cd "${{ secrets.VPS_APP_PATH }}"

            # Update BUNDLE_CONFIG di server/app-version.js menggunakan node
            node - << 'JSEOF'
          const fs = require('fs')
          const file = 'server/app-version.js'
          let src = fs.readFileSync(file, 'utf8')

          src = src.replace(/(bundleVersion:\s*')[^']*(')/,  \`\$1${VERSION}\$2\`)
          src = src.replace(/(bundleUrl:\s*')[^']*(')/,      \`\$1${BUNDLE_URL}\$2\`)
          src = src.replace(/(bundleSize:\s*)\d+/,           \`\$1${SIZE}\`)
          src = src.replace(/(bundleChecksum:\s*')[^']*(')/,  \`\$1${CHECKSUM}\$2\`)

          fs.writeFileSync(file, src)
          console.log('app-version.js updated: v${VERSION}')
          JSEOF

            # Restart server (pm2)
            pm2 restart "${{ secrets.VPS_PM2_NAME }}" --update-env
            echo "Server restarted"
          EOF

      # ── 10. Ringkasan ───────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ OTA Bundle Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`${{ env.BUNDLE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ env.BUNDLE_SIZE }} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Checksum | \`${{ env.BUNDLE_CHECKSUM }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | \`${{ secrets.VPS_BUNDLE_BASE_URL }}/bundles/${{ env.BUNDLE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
